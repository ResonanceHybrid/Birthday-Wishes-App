name: birthday_wishes
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+2

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  # iOS-style icons
  cupertino_icons: ^1.0.8

  # Audio player for intro music
  audioplayers: ^6.5.1

  # URL launcher for opening links
  url_launcher: ^6.3.2

  # App update handler
  in_app_update: ^4.2.2

  # Push notifications
  onesignal_flutter: ^5.3.5

  # Typography (Google Fonts)
  google_fonts: ^6.2.1

  # Image handling
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  image_gallery_saver_plus: ^4.0.1

  # Permissions
  permission_handler: ^11.4.0

  # Color picker UI
  flutter_colorpicker: ^1.1.0

  # Sharing
  share_plus: ^10.1.4

  # Local storage
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting and best practices
  flutter_lints: ^6.0.0
  
  # App icon generator
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/backgrounds/
    - assets/images/
    - assets/fonts/
    - lib/assets/logo.png
    - assets/audio/intro.mp3
    - assets/icon/app_icon.png

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
    - family: Dancing Script
      fonts:
        - asset: assets/fonts/DancingScript-Regular.ttf
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
    - family: Pacifico
      fonts:
        - asset: assets/fonts/Pacifico-Regular.ttf
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
